name: Mirror OpenCelliD tower data

on:
  schedule:
    - cron: "0 4 3 * *"   # monthly, 04:00 UTC on the 3rd
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Test mirror script
        run: python3 -m unittest tools/mirror/test_mirror.py

      - name: Download per-country exports
        env:
          TOKEN: ${{ secrets.OPENCELLID_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TOKEN" || { echo "OPENCELLID_TOKEN secret is not set"; exit 1; }
          mkdir -p in
          redact() { sed -E "s/(token=)[^&\"' ]*/\1***/g"; }  # GitHub also masks the secret itself
          # The downloads page is a form that POSTs the token; the links appear in the response.
          curl -fsSL -c cookies.txt -b cookies.txt --data-urlencode "token=$TOKEN" \
            "https://opencellid.org/downloads.php" -o downloads.html
          # Per-country exports: any link whose file name is <3-digit MCC>.csv.gz. Take each MCC once.
          { grep -oE "href=[\"'][^\"']*[^0-9][0-9]{3}\.csv\.gz[^\"']*[\"']" downloads.html || true; } \
            | sed -E "s/^href=[\"']//; s/[\"']$//; s/&amp;/\&/g" | sort -u > links.txt
          if ! test -s links.txt; then
            echo "No per-country links found; the downloads page format may differ. Page summary (token redacted):"
            echo "--- title / messages"; grep -oiE '<title>[^<]*|alert[^>]*>[^<]{0,200}' downloads.html | redact | head -5 || true
            echo "--- links mentioning csv/gz/download"; grep -oiE "href=[\"'][^\"']*(csv|gz|download)[^\"']*[\"']" downloads.html | redact | sort -u | head -40 || true
            echo "--- forms"; grep -oiE '<form[^>]*>|<input[^>]*name=[^>]*>' downloads.html | redact | head -10 || true
            exit 1
          fi
          echo "Found $(wc -l < links.txt) per-country links"
          while read -r link; do
            case "$link" in http*) url="$link" ;; /*) url="https://opencellid.org$link" ;; *) url="https://opencellid.org/$link" ;; esac
            mcc=$(echo "$link" | grep -oE '[0-9]{3}\.csv\.gz' | head -1 | cut -c1-3)
            # Keep a file only if it is a complete gzip (errors can come back as HTML with HTTP 200).
            if curl -fsSL -b cookies.txt "$url" -o "tmp.gz" && gzip -t tmp.gz 2>/dev/null; then
              mv tmp.gz "in/$mcc.csv.gz"
            else
              rm -f tmp.gz; echo "::warning::download failed for MCC $mcc"
            fi
            sleep 2
          done < links.txt
          ls in | wc -l

      - name: Slim and index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Countries that fail this month keep last month's entry (their file stays on the release).
          gh release download towers-latest -p index.json -D prev 2>/dev/null || true
          python3 tools/mirror/mirror.py in out --previous-index prev/index.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          month=$(date -u +%Y-%m)
          gh release view towers-latest >/dev/null 2>&1 || \
            gh release create towers-latest --title "Tower data (latest)" --notes-file tools/mirror/LICENSE-DATA.txt --latest=false
          # Upload data files first and the index last, so the index never points at a missing file.
          find out -type f ! -name index.json -exec gh release upload towers-latest {} --clobber \;
          gh release upload towers-latest out/index.json --clobber
          gh release view "towers-$month" >/dev/null 2>&1 || \
            gh release create "towers-$month" out/* --title "Tower data $month" --notes-file tools/mirror/LICENSE-DATA.txt --latest=false
